services:
  db:
    image: postgres:16.3
    container_name: invoice-payment-db
    environment:
      POSTGRES_DB: super_shiharai_kun
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d super_shiharai_kun"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
