# バリデーションエラーメッセージ（日本語）
validation.required=入力してください

# PaymentAmount
validation.paymentAmount.min=支払金額は0より大きい値にしてください
validation.paymentAmount.scale=支払金額の精度が正しくありません

# IssueDate
validation.issueDate.future=発行日は過去または今日の日付にしてください

# PaymentDueDate
validation.paymentDueDate.notFuture=支払期日は未来の日付にしてください

# InvoiceId
validation.invoiceId.zeroOrNegative=請求書IDは0より大きい値である必要があります

# TotalAmount
validation.totalAmount.negative=請求金額は負の値である必要があります
validation.totalAmount.scale=請求金額の精度が正しくありません

# Fee
validation.fee.negative=手数料は負の値である必要があります
validation.fee.scale=手数料の精度が正しくありません

# TaxAmount
validation.taxAmount.negative=消費税は負の値である必要があります
validation.taxAmount.scale=消費税の精度が正しくありません

# FeeRate
validation.feeRate.scale=手数料率の精度が正しくありません

# TaxRate
validation.taxRate.scale=消費税率の精度が正しくありません

# UserId
validation.userId.zeroOrNegative=ユーザーIDは0より大きい値である必要があります

# Email
validation.email.format=メールアドレスの形式が正しくありません

# 汎用メッセージ
validation.maxLength={0}文字以内にしてください

# Password
validation.password.length=パスワードは8文字以上にしてください
validation.password.characterTypes=パスワードは英大文字・小文字・数値・記号の4種のうち3種以上を含めてください

# HashedPassword
validation.hashedPassword.empty=ハッシュ化パスワードは空である必要があります

# AccessToken
validation.accessToken.format=アクセストークンの形式が正しくありません

# PageNumber
validation.pageNumber.min=ページ番号は1以上にしてください

# PageSize
validation.pageSize.min=ページサイズは1以上にしてください
validation.pageSize.max=ページサイズは100以下にしてください

# PaymentDueDate (for list)
validation.paymentDueTo.range=支払期日の終了日は開始日より後の日付にしてください

# Date format
validation.date.format=日付の形式が正しくありません

