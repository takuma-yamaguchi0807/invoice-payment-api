spring:
  application:
    name: invoice-payment-api

  datasource:
    url: jdbc:postgresql://localhost:5432/super_shiharai_kun
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-change-this-in-production}
  expiration: ${JWT_EXPIRATION:86400}

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}
    com.example.invoicepaymentapi: DEBUG
